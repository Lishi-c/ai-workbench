# 国内镜像：cargo 下载 crates.io 依赖走 rsproxy.cn，避免直连 crates.io 超时
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# 系统代理（Clash 等）可能指向 127.0.0.1:7890 但进程未运行，导致拉取依赖失败；
# rsproxy.cn 是国内镜像，应直连，这里显式禁用代理。
[http]
proxy = ""
