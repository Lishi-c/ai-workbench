appId: com.lumi.workbench
productName: 月蓝琉璃工作台
directories:
  output: release
files:
  - dist/**
  - electron/**
  - "!node_modules/**"
asar: true
npmRebuild: false
# 只打包中/英语言包，裁掉其余 53 种（解压后省约 46MB）
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - nsis
  icon: build/icon.ico
  signExecutable: false
  # 最高压缩比（打包更慢但体积更小）
  compression: maximum
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 月蓝琉璃工作台
  artifactName: ${productName}-Setup-v${version}.exe
