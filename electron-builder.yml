appId: com.lumi.workbench
productName: 月蓝琉璃工作台
directories:
  output: release
files:
  - dist/**
  - electron/**
  - "!node_modules/**"
asar: true
npmRebuild: false
win:
  target:
    - nsis
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 月蓝琉璃工作台
  artifactName: ${productName}-Setup-v${version}.exe
