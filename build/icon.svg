<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#f2f7fc"/>
      <stop offset="0.55" stop-color="#d9e8f3"/>
      <stop offset="1" stop-color="#bcd7ec"/>
    </linearGradient>
    <radialGradient id="pinkG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3a6c3" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#db5c91" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#db5c91" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#90c9ee" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#4aa1dc" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4aa1dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="moon">
      <circle cx="128" cy="128" r="62" fill="white"/>
      <circle cx="154" cy="112" r="51" fill="black"/>
    </mask>
    <clipPath id="tile">
      <rect x="6" y="6" width="244" height="244" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="6" y="6" width="244" height="244" fill="url(#bg)"/>
    <circle cx="82" cy="88" r="78" fill="url(#pinkG)"/>
    <circle cx="180" cy="180" r="82" fill="url(#blueG)"/>
    <rect x="6" y="6" width="244" height="244" fill="url(#sheen)"/>
    <circle cx="128" cy="128" r="62" fill="#ffffff" opacity="0.96" mask="url(#moon)"/>
  </g>

  <rect x="7.5" y="7.5" width="241" height="241" rx="54.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
</svg>
